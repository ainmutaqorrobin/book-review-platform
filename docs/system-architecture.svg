<svg width="1200" height="820" viewBox="0 0 1200 820" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Book Review Platform system architecture</title>
  <desc id="desc">Layered architecture diagram showing browser, Nginx, Next.js frontend, Express API, backend worker, PostgreSQL, Redis BullMQ, RustFS S3 storage, and Mastra AI provider.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#16a34a" />
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#ea580c" />
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#9333ea" />
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="1200" height="820" rx="28" fill="#f8fafc" />
  <text x="600" y="56" text-anchor="middle" fill="#172554" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Book Review Platform Architecture</text>
  <text x="600" y="86" text-anchor="middle" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="15">Fast review submission with asynchronous AI enrichment through Redis and a dedicated worker</text>

  <rect x="70" y="125" width="1060" height="115" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" />
  <text x="95" y="158" fill="#1d4ed8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Edge</text>

  <rect x="70" y="285" width="1060" height="170" rx="20" fill="#f0fdf4" stroke="#4ade80" stroke-width="2" />
  <text x="95" y="318" fill="#15803d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Application Layer</text>

  <rect x="70" y="510" width="1060" height="175" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="2" />
  <text x="95" y="543" fill="#c2410c" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Data and Infrastructure</text>

  <g filter="url(#soft-shadow)">
    <rect x="170" y="165" width="160" height="52" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text x="250" y="197" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">User Browser</text>

    <rect x="510" y="165" width="180" height="52" rx="14" fill="#bfdbfe" stroke="#2563eb" stroke-width="2" />
    <text x="600" y="197" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Nginx Reverse Proxy</text>

    <rect x="155" y="345" width="190" height="72" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text x="250" y="375" text-anchor="middle" fill="#14532d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Next.js Frontend</text>
    <text x="250" y="398" text-anchor="middle" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="12">App Router UI</text>

    <rect x="505" y="340" width="190" height="82" rx="14" fill="#bbf7d0" stroke="#16a34a" stroke-width="2" />
    <text x="600" y="370" text-anchor="middle" fill="#14532d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Express API</text>
    <text x="600" y="393" text-anchor="middle" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="12">auth, books, reviews, uploads</text>

    <rect x="855" y="340" width="190" height="82" rx="14" fill="#bbf7d0" stroke="#16a34a" stroke-width="2" />
    <text x="950" y="370" text-anchor="middle" fill="#14532d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Backend Worker</text>
    <text x="950" y="393" text-anchor="middle" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="12">AI enrichment jobs</text>

    <rect x="145" y="575" width="210" height="78" rx="14" fill="#fed7aa" stroke="#ea580c" stroke-width="2" />
    <text x="250" y="606" text-anchor="middle" fill="#7c2d12" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">PostgreSQL</text>
    <text x="250" y="629" text-anchor="middle" fill="#9a3412" font-family="Segoe UI, Arial, sans-serif" font-size="12">users, books, reviews</text>

    <rect x="495" y="575" width="210" height="78" rx="14" fill="#fed7aa" stroke="#ea580c" stroke-width="2" />
    <text x="600" y="606" text-anchor="middle" fill="#7c2d12" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Redis / BullMQ</text>
    <text x="600" y="629" text-anchor="middle" fill="#9a3412" font-family="Segoe UI, Arial, sans-serif" font-size="12">review-enrichment queue</text>

    <rect x="845" y="575" width="210" height="78" rx="14" fill="#fed7aa" stroke="#ea580c" stroke-width="2" />
    <text x="950" y="606" text-anchor="middle" fill="#7c2d12" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">RustFS / S3</text>
    <text x="950" y="629" text-anchor="middle" fill="#9a3412" font-family="Segoe UI, Arial, sans-serif" font-size="12">book cover objects</text>

    <rect x="845" y="725" width="210" height="70" rx="14" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" />
    <text x="950" y="754" text-anchor="middle" fill="#581c87" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Mastra AI Provider</text>
    <text x="950" y="777" text-anchor="middle" fill="#7e22ce" font-family="Segoe UI, Arial, sans-serif" font-size="12">summary, sentiment, tags</text>
  </g>

  <path d="M330 191 H500" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)" />
  <path d="M560 217 C520 260 350 300 285 342" stroke="#16a34a" stroke-width="2.4" fill="none" marker-end="url(#arrow-green)" />
  <path d="M640 217 C670 260 650 300 625 337" stroke="#16a34a" stroke-width="2.4" fill="none" marker-end="url(#arrow-green)" />
  <path d="M345 381 H495" stroke="#16a34a" stroke-width="2.4" marker-end="url(#arrow-green)" />

  <path d="M570 422 C520 470 355 520 280 570" stroke="#ea580c" stroke-width="2.4" fill="none" marker-end="url(#arrow-orange)" />
  <path d="M600 422 V565" stroke="#ea580c" stroke-width="2.4" marker-end="url(#arrow-orange)" />
  <path d="M650 422 C725 480 865 515 925 570" stroke="#ea580c" stroke-width="2.4" fill="none" marker-end="url(#arrow-orange)" />
  <path d="M915 422 C830 485 715 520 630 570" stroke="#ea580c" stroke-width="2.4" fill="none" marker-end="url(#arrow-orange)" />
  <path d="M885 422 C750 510 430 530 300 570" stroke="#ea580c" stroke-width="2.4" fill="none" marker-end="url(#arrow-orange)" />
  <path d="M950 422 V715" stroke="#9333ea" stroke-width="2.4" marker-end="url(#arrow-purple)" />

  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">
    <rect x="393" y="174" width="60" height="24" rx="12" fill="#f8fafc" />
    <text x="423" y="191" text-anchor="middle" fill="#1d4ed8">HTTPS</text>
    <rect x="370" y="365" width="78" height="24" rx="12" fill="#f8fafc" />
    <text x="409" y="382" text-anchor="middle" fill="#166534">REST API</text>
    <rect x="500" y="486" width="82" height="24" rx="12" fill="#f8fafc" />
    <text x="541" y="503" text-anchor="middle" fill="#9a3412">read/write</text>
    <rect x="611" y="486" width="86" height="24" rx="12" fill="#f8fafc" />
    <text x="654" y="503" text-anchor="middle" fill="#9a3412">enqueue job</text>
    <rect x="780" y="496" width="92" height="24" rx="12" fill="#f8fafc" />
    <text x="826" y="513" text-anchor="middle" fill="#9a3412">cover upload</text>
    <rect x="722" y="512" width="92" height="24" rx="12" fill="#f8fafc" />
    <text x="768" y="529" text-anchor="middle" fill="#9a3412">consume job</text>
  </g>
</svg>
